<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Red Ribbon Gradient -->
    <linearGradient id="redRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B3E" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B30006" />
    </linearGradient>

    <!-- Play Button Triangle Gradient -->
    <linearGradient id="playTriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2D" />
      <stop offset="100%" stop-color="#D6000B" />
    </linearGradient>

    <!-- Dark T Gradient -->
    <linearGradient id="darkTGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3139" />
      <stop offset="40%" stop-color="#1E2127" />
      <stop offset="100%" stop-color="#121418" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="playShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Right Dark 'T' Element -->
    <!-- Top Horizontal Bar of 'T' -->
    <path
      d="M 210 118 
         L 392 118 
         C 416 118, 430 134, 420 156 
         L 404 170 
         C 396 178, 382 182, 368 182 
         L 306 182 
         C 292 182, 286 190, 286 204 
         L 286 322 
         C 286 342, 270 358, 250 358 
         L 242 358 
         C 222 358, 206 342, 206 322 
         L 206 182 
         C 206 148, 178 190, 210 118 Z"
      fill="url(#darkTGrad)"
    />

    <!-- Vertical Stem of 'T' (Lower Column) -->
    <rect
      x="306"
      y="180"
      width="54"
      height="160"
      rx="27"
      fill="url(#darkTGrad)"
    />

    <!-- Left Red Ribbon / 'Y' Arm -->
    <path
      d="M 108 124 
         C 98 124, 88 132, 94 146 
         L 194 330 
         C 204 350, 224 358, 238 346 
         C 252 334, 252 312, 240 290 
         L 164 150 
         C 156 134, 144 124, 126 124 Z"
      fill="url(#redRibbonGrad)"
    />

    <!-- Bottom Left Red Curve Loop -->
    <path
      d="M 170 256 
         L 170 310 
         C 170 336, 186 358, 212 358 
         C 226 358, 236 348, 240 336 
         L 186 230 Z"
      fill="#B30006"
    />

    <!-- Center Floating Play Button (Triangle Badge) -->
    <g filter="url(#playShadow)" transform="translate(194, 188)">
      <!-- Outer White Border Layer -->
      <path
        d="M 14 16 
           C 6 2 26 -8 38 0 
           L 112 52 
           C 126 62, 126 82, 112 92 
           L 38 144 
           C 26 152, 6 142, 14 128 
           Z"
        fill="#FFFFFF"
      />
      <!-- Red Play Triangle Body -->
      <path
        d="M 18 22 
           C 12 10, 28 2, 38 8 
           L 106 56 
           C 118 64, 118 80, 106 88 
           L 38 136 
           C 28 142, 12 134, 18 122 
           Z"
        fill="url(#playTriGrad)"
      />
      <!-- Inner White Play Cutout (Hollow/Solid Play Marker) -->
      <path
        d="M 44 48 
           C 40 44, 48 40, 52 44 
           L 80 66 
           C 86 70, 86 78, 80 82 
           L 52 104 
           C 48 108, 40 104, 44 100 
           Z"
        fill="#FFFFFF"
      />
    </g>
  </g>
</svg>
